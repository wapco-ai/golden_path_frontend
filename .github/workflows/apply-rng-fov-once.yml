name: apply-rng-fov-once
on:
  push:
    branches: [fix/rng-guidance-fov-60]
    paths: [.github/workflows/apply-rng-fov-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/rng-guidance-fov-60
      - name: Apply and verify exact request-only correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def checked(path, expected):
              data = Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (path, actual)
              return data
          routing = checked('src/pages/Routing.jsx', 'a6dee5a6c2ec2dbab5b40bf400f4374bdccc80e1')
          tests = checked('tests/rngNavigation.test.js', '267d05f0bc7260aef5c6b576ca61fb05caf24f8b')
          old = b'floor: navigationFrame.floor, fov: 45, maxDistance: 250'
          new = b'floor: navigationFrame.floor, fov: 60, maxDistance: 250'
          assert routing.count(old) == 1
          assert tests.count(b"import assert from 'node:assert/strict';\n") == 1
          tests = tests.replace(b"import assert from 'node:assert/strict';\n", b"import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n")
          tests += r'''
          // Read the actual RNG call site: service defaults alone did not catch the
          // page's explicit 45-degree override. No database or live network is used.
          const rngImageOptions = () => {
            const source = readFileSync(new URL('../src/pages/Routing.jsx', import.meta.url), 'utf8');
            const call = source.match(/useGuidanceImage\(\{([\s\S]*?)\}, guidanceContextKey\)/);
            assert.ok(call, 'The RNG image request must be wired to the shared navigation frame');
            assert.match(call[1], /geo: navigationFrame\.geo/);
            assert.match(call[1], /heading: effectiveHeading/);
            assert.match(call[1], /floor: navigationFrame\.floor/);
            const fov = call[1].match(/\bfov:\s*(\d+)/);
            const maxDistance = call[1].match(/\bmaxDistance:\s*(\d+)/);
            assert.ok(fov && maxDistance);
            return { fov: Number(fov[1]), maxDistance: Number(maxDistance[1]) };
          };

          test('RNG uses a 60-degree request FOV for the reported diagonal-heading case', () => {
            const options = rngImageOptions();
            assert.deepEqual(options, { fov: 60, maxDistance: 250 });
            const imageFov = 60;
            const difference = Math.abs(90 - 62.318348205083794);
            assert.ok(difference > Math.min(imageFov, 45) / 2);
            assert.ok(difference <= Math.min(imageFov, options.fov) / 2);
          });

          test('RNG FOV reaches the image request without changing position, heading or source', async (t) => {
            const heading = 62.318348205083794;
            const options = rngImageOptions();
            t.mock.method(globalThis, 'fetch', async (url) => {
              const params = new URL(url).searchParams;
              assert.equal(params.get('fov'), '60');
              assert.equal(params.get('max_distance'), '250');
              assert.equal(params.get('source'), 'guidance_points');
              assert.equal(Number(params.get('heading')), heading);
              assert.equal(Number(params.get('geo[lat]')), input.geo.lat);
              assert.equal(Number(params.get('geo[lng]')), input.geo.lng);
              assert.equal(params.get('floor'), '0');
              return { ok: true, json: async () => ({
                status: 'OK', source: 'guidance_points',
                image: { id: 31, url: '/storage/test-guidance.jpg' }
              }) };
            });
            const result = await fetchLandmarkViewImage({ ...input, ...options, heading });
            assert.equal(result.image.id, 31);
            assert.equal(result.status, 'OK');
          });
          '''.encode()
          Path('tests/rngNavigation.test.js').write_bytes(tests)
          PY
          # The new regression must fail while the old 45-degree override remains.
          if node --test tests/rngNavigation.test.js > /tmp/rng-fov-before.log 2>&1; then
            cat /tmp/rng-fov-before.log
            echo 'Expected the 45-degree regression to fail before the correction.'
            exit 1
          fi
          grep -q 'not ok.*RNG uses a 60-degree request FOV' /tmp/rng-fov-before.log
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Routing.jsx')
          data = path.read_bytes()
          old = b'floor: navigationFrame.floor, fov: 45, maxDistance: 250'
          assert data.count(old) == 1
          path.write_bytes(data.replace(old, b'floor: navigationFrame.floor, fov: 60, maxDistance: 250'))
          PY
          node --test tests/rngNavigation.test.js
          git diff --check
          git diff --stat
          git add src/pages/Routing.jsx tests/rngNavigation.test.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: align RNG guidance request FOV with 60-degree images'
          git push origin HEAD:refs/heads/fix/rng-guidance-fov-60
