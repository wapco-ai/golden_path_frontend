name: apply-guidance-gsm-once
on:
  push:
    branches: [fix/guidance-map-gsm-tiles]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wapco-ai/golden_path_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/guidance-map-gsm-tiles
      - name: Apply exact reviewed basemap change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('src/AdminPanel/Marks.jsx')
          expected = '5b27592d6ee74b8b56f2302c8a28acdaf7a4efc9'
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == expected
          data = p.read_bytes()
          changes = [
              (b"import { deleteFile } from '../services/fileService';", b"import { deleteFile } from '../services/fileService';\nimport { MBTILES_SATELLITE_STYLE } from '../services/mbtilesMapStyle';"),
              (b"style: './map-styles/osm-voyager/style-en.json',", b"style: MBTILES_SATELLITE_STYLE,"),
          ]
          for old, new in changes:
              assert data.count(old) == 1, old
              data = data.replace(old, new)
          p.write_bytes(data)
          PY
          git diff --check
          test "$(git diff --numstat)" = "$(printf '2\t1\tsrc/AdminPanel/Marks.jsx')"
          git add src/AdminPanel/Marks.jsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: use shared GSM satellite basemap for guidance point placement'
          git push origin HEAD:refs/heads/fix/guidance-map-gsm-tiles
