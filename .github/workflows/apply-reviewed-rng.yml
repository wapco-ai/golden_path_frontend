name: apply-reviewed-rng

# Temporary, branch-scoped publication of two locally verified source files.
# Removed before merge. The script verifies exact input AND output Git blob hashes.
on:
  push:
    branches: [fix/rng-guidance-demo]
    paths: [.github/apply-reviewed-rng.py, .github/workflows/apply-reviewed-rng.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/rng-guidance-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-verified source changes on the feature branch only
        run: |
          set -euo pipefail
          python3 .github/apply-reviewed-rng.py
          git diff --check
          git add -- src/pages/Routing.jsx src/components/map/RouteMap.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: wire reviewed RNG demo, live imagery and step progression'
          git push origin HEAD:refs/heads/fix/rng-guidance-demo
