name: format-coverage-once
on:
  push:
    branches: [fix/guidance-coverage-radius]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'wapco-ai/golden_path_frontend' && github.ref == 'refs/heads/fix/guidance-coverage-radius'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/guidance-coverage-radius
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          p = Path('src/AdminPanel/Marks.jsx')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '60f50083494b69243b09740945147b9c3fc5e380'
          s = p.read_text()
          s, count = re.subn(r'(?m)^        <label htmlFor="(?:add|edit)-guidance-coverage-radius">[\s\S]*?^      </div>$', lambda m: '\n'.join('          ' + line for line in m.group().split('\n')), s)
          assert count == 2
          p.write_text(s)
          PY
          git diff --check
          node --test tests/guidanceCoverage.test.js
          git rm .github/workflows/format-coverage-once.yml
          git add src/AdminPanel/Marks.jsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: match coverage field source indentation to existing form'
          git push origin HEAD:refs/heads/fix/guidance-coverage-radius
