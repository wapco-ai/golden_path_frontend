name: frontend-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Inspect installed Zustand exports
        run: |
          npm ls zustand
          node --input-type=module -e "import * as m from 'zustand/middleware'; console.log(Object.keys(m)); console.log(import.meta.resolve('zustand/middleware'));"
          cat node_modules/zustand/package.json
          node -e "const f=require('fs'); const p=require.resolve('zustand/middleware'); console.log(p); console.log(f.readFileSync(p,'utf8').slice(0,4000));"
      - run: npm test
      - run: npm run build
