name: frontend-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Route and RNG regression tests
        run: npm test
      - name: Verify tests do not corrupt installed dependencies
        run: node --input-type=module -e "import { createJSONStorage } from 'zustand/middleware'; if (typeof createJSONStorage !== 'function') process.exit(1);"
      - run: npm run build
