name: restore-rng-appearance-once
on:
  push:
    branches: [fix/rng-restore-appearance]
permissions:
  contents: write
jobs:
  apply-reviewed-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply only the locally verified appearance restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/pages/Routing.jsx')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(p.read_bytes()) == '0120a65a051cb08db8929c77f07c2cf5ead21cf2', 'Unexpected starting Routing.jsx'
          s = p.read_text()
          def rep(old, new):
              global s
              assert s.count(old) == 1, 'Replacement not unique: ' + old[:80]
              s = s.replace(old, new)
          rep("import '../styles/RngNavigation.css';\n", '')
          rep('''  const exitDemo = () => {
              setIsDemoMode(false);
              setHasArrived(false);
              setCurrentStep(0);
            };

          ''', '')
          rep('''                  {isDemoMode && (
                              <div className="rng-demo-status" role="status">
                                <span>{rngText.demo} — {formatDigits(currentStep + 1)}/{formatDigits(routeData.steps.length)}</span>
                                <button type="button" onClick={exitDemo}>{rngText.exit}</button>
                              </div>
                            )}
          ''', '')
          rep('''                alt={liveLandmarkImage?.content?.title || rngText.imageAlt}''', '''                alt={liveLandmarkImage?.content?.title || 'landmark'}''')
          rep('''              {guidanceImage.error ? rngText.error
                          : liveLandmarkImage?.image?.url && failedImageUrl === liveLandmarkImage.image.url ? rngText.imageError
                          : isLiveImageLoading ? <FormattedMessage id="liveLandmarkLoading" /> : rngText.waiting}''', '''              {isLiveImageLoading ? <FormattedMessage id="liveLandmarkLoading" /> : <FormattedMessage id="liveLandmarkWaiting" />}''')
          rep('''                        <button
                                    type="button"
                                    className="direction-icon-rng"
                                    onClick={handleDirectionIconClick}
                                    onPointerDown={(event) => event.stopPropagation()}
                                    aria-label={rngText.next}
                                    title={rngText.next}
                                    disabled={!routeGeo || !routeData.steps.length}
                                  >
                                    {renderDirectionArrow(routeData.steps[currentStep].direction)}
                                  </button>''', '''                        <span
                                    className="direction-icon-rng"
                                    role="button"
                                    tabIndex={!routeGeo || !routeData.steps.length ? -1 : 0}
                                    aria-disabled={!routeGeo || !routeData.steps.length}
                                    aria-label={rngText.next}
                                    onClick={handleDirectionIconClick}
                                    onPointerDown={(event) => event.stopPropagation()}
                                    onKeyDown={(event) => {
                                      if (event.key === 'Enter' || event.key === ' ') {
                                        event.preventDefault();
                                        handleDirectionIconClick(event);
                                      }
                                    }}
                                  >
                                    {renderDirectionArrow(routeData.steps[currentStep].direction)}
                                  </span>''')
          assert blob(s.encode()) == 'a6dee5a6c2ec2dbab5b40bf400f4374bdccc80e1', 'Unexpected resulting Routing.jsx'
          p.write_text(s)
          css = Path('src/styles/RngNavigation.css')
          assert blob(css.read_bytes()) == '4285fec65c5a6fdde831b92ae61e26699d00162f'
          css.unlink()
          print('Verified appearance-only Routing.jsx:', blob(p.read_bytes()))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/Routing.jsx src/styles/RngNavigation.css
          git commit -m 'fix: restore original RNG appearance while preserving navigation logic'
          git push origin HEAD:refs/heads/fix/rng-restore-appearance
